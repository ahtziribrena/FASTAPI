services:
  database:
    build:
      context: postgres
      target: database
    container_name: database
    env_file:
      - ./postgres/database.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nes_db']
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 5s
    ports:
      - 5434:5432

  backend:
    build:
      context: ./FastApi
      dockerfile: ./backend/Dockerfile
    container_name: FastApi
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./FastApi/proyecto.env
    volumes:
      - ./FastApi/backend:/app/backend
    ports:
      - 8010:8000
      
  frontend:
    build:
      context: ./FastApi
      dockerfile: ./frontend/Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8080:3000"
    environment:
      - HOST=0.0.0.0